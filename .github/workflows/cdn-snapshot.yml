name: cdn-snapshot

# Monthly check of allowlist-cdn.snapshot.txt, the fallback used when a live
# CDN list is rejected. When the live ranges differ from the snapshot, the
# refreshed file is pushed to the cdn-snapshot-refresh branch and a
# "cdn-snapshot" issue links to open the pull request (Actions may not create
# pull requests in this repository, and a PR opened by a person runs the
# normal checks). The issue closes when the snapshot matches again.
on:
  schedule:
    - cron: "29 6 3 * *"
  workflow_dispatch:

concurrency: cdn-snapshot

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compare the live CDN lists with the snapshot
        id: compare
        run: |
          : > problems.txt
          if ! python -m mbl cdn-snapshot --out new-snapshot.txt; then
            echo "the live CDN lists could not be downloaded or were rejected; see the run log" > problems.txt
          elif diff -q <(grep -v '^#' allowlist-cdn.snapshot.txt | sort) <(grep -v '^#' new-snapshot.txt | sort) >/dev/null; then
            echo "The snapshot matches the live ranges."
          else
            diff <(grep -v '^#' allowlist-cdn.snapshot.txt | sort) <(grep -v '^#' new-snapshot.txt | sort) || true
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push the refreshed snapshot
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          mv new-snapshot.txt allowlist-cdn.snapshot.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c cdn-snapshot-refresh
          git add allowlist-cdn.snapshot.txt
          git commit -m "chore: refresh the CDN allowlist snapshot"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.extraheader=Authorization: Basic ${auth}" \
            push -f "https://github.com/${REPO}" cdn-snapshot-refresh
          echo "the CDN ranges changed: a refreshed snapshot is on the cdn-snapshot-refresh branch; open the PR at https://github.com/${REPO}/compare/main...cdn-snapshot-refresh?expand=1" > problems.txt

      - name: Update the cdn-snapshot issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          .github/scripts/health-issue.sh cdn-snapshot "CDN snapshot: needs attention" problems.txt
