name: build

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      allow_growth:
        description: "Publish even if the total more than doubles (expected jump, e.g. a new source)"
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m unittest discover -v

  publish:
    needs: test
    # Never publish from pull requests or from branches other than main.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # An explicit permissions block raises the token to write, so no repo
    # setting needs changing.
    permissions:
      contents: write
    concurrency: publish
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # DB-IP Lite country data for lookup.json, refreshed monthly. The fetch
      # never fails the job: without a file the build just omits countries.
      - name: Month for DB-IP cache key
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .dbip
          key: dbip-${{ steps.month.outputs.month }}
      - name: Fetch DB-IP
        run: echo "DBIP=$(python -m mbl dbip-fetch --cache .dbip)" >> "$GITHUB_ENV"

      # Exit code 1 (safety checks failed) fails the step and therefore the
      # job, so nothing is published. allow_growth is only set by a manual
      # run (empty on schedule and push) and skips only the 2x growth check.
      - name: Build
        env:
          ALLOW_GROWTH: ${{ inputs.allow_growth }}
          PREVIOUS_STATS: "https://raw.githubusercontent.com/${{ github.repository }}/lists/stats.json"
        run: |
          extra=()
          if [ "$ALLOW_GROWTH" = "true" ]; then extra+=(--allow-growth); fi
          python -m mbl build \
            --sources sources.toml \
            --allowlist allowlist.txt \
            --out dist \
            --previous-stats "$PREVIOUS_STATS" \
            ${DBIP:+--dbip "$DBIP"} \
            "${extra[@]}"

      # The lists branch is orphan and overwritten with a single commit.
      - name: Publish to lists branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        working-directory: dist
        run: |
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git init -b lists
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "lists: $(date -u +%Y-%m-%d)"
          git -c "http.extraheader=Authorization: Basic ${auth}" \
            push -f "https://github.com/${REPO}" lists

  # Daily health report: one "build-health" issue, opened when something needs
  # attention (failed or empty source, CDN snapshot in use or getting old, IPv6
  # withheld, stale lists, failed run) and closed when a run is healthy again.
  # Only on the schedule: push and manual runs do not open or close it.
  health:
    needs: publish
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check the published build
        env:
          PUBLISH_RESULT: ${{ needs.publish.result }}
          # The query string skips the raw CDN cache, so today's publish is read.
          STATS: "https://raw.githubusercontent.com/${{ github.repository }}/lists/stats.json?run=${{ github.run_id }}"
        run: |
          if [ "$PUBLISH_RESULT" != "success" ]; then
            echo "the build did not publish (publish job: $PUBLISH_RESULT; skipped means the tests failed); see the run log" > problems.txt
          else
            : > problems.txt
          fi
          # 3 means problems were found; anything else is a crash and fails the job
          # instead of closing the issue as healthy.
          rc=0
          python -m mbl health --stats "$STATS" >> problems.txt || rc=$?
          if [ "$rc" != 0 ] && [ "$rc" != 3 ]; then exit "$rc"; fi
          cat problems.txt
      - name: Update the build-health issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          .github/scripts/health-issue.sh build-health "Build health: needs attention" problems.txt
