name: routeros-e2e

on:
  pull_request:
    paths:
      - "routeros/**"
      - "mbl/**"
      - "tests/e2e/**"
      - ".github/workflows/routeros-e2e.yml"
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:
    inputs:
      chr_version:
        description: "CHR version to test (empty = the pinned one in tests/e2e/chr-version.txt)"
        type: string
        default: ""

concurrency:
  group: routeros-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      chr_version: ${{ steps.chr.outputs.version }}
    permissions:
      contents: read
    env:
      MBL_E2E: "1"
      MBL_E2E_CACHE: ${{ github.workspace }}/.chr-cache
      MBL_E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install QEMU and tools
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-utils openssl unzip

      - name: Resolve CHR version
        id: chr
        env:
          INPUT_VERSION: ${{ github.event.inputs.chr_version }}
        run: |
          read -r pinned_version pinned_sha < tests/e2e/chr-version.txt
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            version=$(python -c 'from tests.e2e.harness import latest_stable; print(latest_stable())')
            sha=""
          elif [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
            sha=""
          else
            version="$pinned_version"
            sha="$pinned_sha"
          fi
          # Whatever the source (input, upgrade server, pinned file), only a
          # plain version string reaches GITHUB_OUTPUT / GITHUB_ENV. Bash [[ =~ ]]
          # matches the whole string, so a multi-line value never passes (grep
          # would accept it when any one line matches).
          re='^[0-9]+(\.[0-9]+)+([a-z]+[0-9]+)?$'
          if ! [[ $version =~ $re ]]; then
            echo "::error::invalid CHR version: $version"
            exit 1
          fi
          # A version equal to the pinned one keeps its checksum.
          if [ "$version" = "$pinned_version" ]; then sha="$pinned_sha"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "MBL_E2E_CHR_VERSION=$version" >> "$GITHUB_ENV"
          echo "MBL_E2E_CHR_SHA256=$sha" >> "$GITHUB_ENV"
          echo "CHR version under test: $version" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/cache@v6
        with:
          path: .chr-cache
          key: chr-${{ steps.chr.outputs.version }}

      - name: RouterOS end-to-end tests
        timeout-minutes: 25
        run: python -m unittest tests.e2e.test_routeros -v

      - name: Record the downloaded image checksum
        if: always() && env.MBL_E2E_CHR_SHA256 == ''
        run: |
          f=".chr-cache/chr-${MBL_E2E_CHR_VERSION}.img.zip"
          if [ -f "$f" ]; then
            echo "sha256 of chr-${MBL_E2E_CHR_VERSION}.img.zip (not pinned): $(sha256sum "$f" | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload console and router logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: routeros-e2e-logs
          path: e2e-artifacts/
          if-no-files-found: warn

  # The weekly run tests the latest stable RouterOS: a failure there usually
  # means a RouterOS change, so it opens a "routeros-e2e" issue, and the next
  # healthy weekly run closes it.
  report:
    needs: e2e
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Update the routeros-e2e issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          RESULT: ${{ needs.e2e.result }}
          CHR_VERSION: ${{ needs.e2e.outputs.chr_version }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "the end-to-end tests on RouterOS ${CHR_VERSION:-(unknown version)} did not pass (e2e job: $RESULT)" > problems.txt
          else
            : > problems.txt
          fi
          .github/scripts/health-issue.sh routeros-e2e "RouterOS e2e: latest stable fails" problems.txt
