# Source catalog. Formats: plain, dshield, threatfox_csv, c2intel_csv, csv (first column). Categories: attack, c2.
# Home / non-commercial use only: non-commercial licenses are accepted.
#
# Removed: greensnow (https://blocklist.greensnow.co/greensnow.txt) - its site states
# "Reproduction or republication strictly prohibited"; this project republishes the data.
#
# Removed after the 2026-10-20 source study (docs/source-study-2026-10-20.md):
#   feodo (abuse.ch Feodo Tracker) - not updated since 2026-03-04
#   c2intel (drb-ra C2IntelFeeds 30-day) - 100% contained in threatfox
#   bruteforceblocker - ~98% identical to et-compromised, adds nothing
#   et-block - Spamhaus DROP + DShield, both already in the catalog
#   stopforumspam (toxic CIDRs) - forum-spam ranges, no value for a router
# Rejected: dataplane.org (forbids redistribution), aggregators (Data-Shield,
#   ThreatHive, FireHOL), and feeds that hit popular sites (blocklist.net.ua,
#   TweetFeed, romainmarcoux, FireHOL level3).

[[source]]
name = "spamhaus-drop"
url = "https://www.spamhaus.org/drop/drop.txt"
format = "plain"
category = "attack"
required = true
license_note = "Free under Spamhaus DROP terms; no explicit redistribution grant - home use"
variants = ["lite", "full"]

